<style>
  :root{
    --bg:#f7f8fa;
    --card:#ffffff;
    --ink:#3b4252;
    --ink-soft:#8a92a6;
    --line:#c9ced8;
    --line-soft:#e6e9ef;
    --sel:#cfe3ff;
    --peer:#e8f0fe;
    --same:#b9d3ff;
    --accent:#3d7eff;
    --given:#3b4252;
    --user:#3d7eff;
    --err:#e5484d;
    --err-bg:#fde8e8;
    --shadow:0 8px 30px rgba(30,40,70,.10);
    --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    -webkit-user-select:none;user-select:none;
    overflow-x:hidden;
  }
  .app{
    width:100%;max-width:430px;
    display:flex;flex-direction:column;
    min-height:100dvh;
    padding:8px 4px 14px;
  }
  .brand{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin:8px 0 16px;
  }
  .brand .ico{width:38px;height:38px;flex:none;}
  .brand h1{
    font-size:23px;font-weight:800;
    letter-spacing:-.4px;margin:0;color:var(--ink);
  }
  .brand h1 span{color:var(--accent);}
  .brand h1 small{font-size:16px;font-weight:500;color:var(--ink-soft);letter-spacing:0;}

  /* Level-Auswahl */
  .levels{display:flex;gap:8px;margin:0 6px 14px;}
  .levels button{
    flex:1;border:none;border-radius:14px;
    padding:11px 0;font-size:14px;font-weight:700;
    background:var(--card);color:var(--ink-soft);
    box-shadow:0 2px 8px rgba(30,40,70,.06);
    transition:.15s;
  }
  .levels button.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(61,126,255,.4);}

  /* Statusleiste */
  .status{
    display:flex;justify-content:space-around;align-items:center;
    margin:0 6px 10px;padding:0 4px;
  }
  .stat{text-align:center;line-height:1.25;}
  .stat .lbl{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .stat .val{font-size:15px;font-weight:700;color:var(--ink);}
  .stat .val.bad{color:var(--err);}
  .status .ctrl{
    display:flex;gap:7px;align-items:center;margin-left:2px;
  }
  .status .ctrl button{
    border:none;border-radius:11px;
    padding:8px 12px;font-size:13px;font-weight:700;
    display:flex;align-items:center;gap:5px;
    background:var(--line-soft);color:var(--ink);
    transition:.15s;
  }
  .status .ctrl button svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .status .ctrl .start{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(61,126,255,.35);}
  .status .ctrl button:active{transform:scale(.94);}
  .status .ctrl button:disabled{opacity:.4;}

  /* Board */
  .board-wrap{padding:0 6px;}
  .board{
    width:100%;aspect-ratio:1/1;
    background:var(--card);
    border:2.5px solid var(--ink);
    border-radius:6px;
    display:grid;
    grid-template-columns:repeat(9,1fr);
    grid-template-rows:repeat(9,1fr);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .cell{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(18px,6.2vw,26px);font-weight:600;
    border-right:1px solid var(--line-soft);
    border-bottom:1px solid var(--line-soft);
    color:var(--user);
    transition:background .08s;
  }
  .cell.given{color:var(--given);font-weight:700;}
  .cell.err{color:var(--err);}
  /* dickere 3x3-Trennlinien */
  .cell:nth-child(9n){border-right:none;}
  .cell[data-c="2"],.cell[data-c="5"]{border-right:2px solid var(--ink);}
  .cell[data-r="2"],.cell[data-r="5"]{border-bottom:2px solid var(--ink);}
  .cell[data-r="8"]{border-bottom:none;}

  .cell.peer{background:var(--peer);}
  .cell.sel{background:var(--sel);}
  .cell.same{background:var(--same);}
  .cell.errflash{background:var(--err-bg);}

  /* Notizen */
  .notes{
    position:absolute;inset:0;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    font-size:clamp(8px,2.6vw,11px);font-weight:600;color:var(--ink-soft);
  }
  .notes span{display:flex;align-items:center;justify-content:center;}

  /* Werkzeuge */
  .tools{
    display:flex;justify-content:space-around;
    margin:16px 6px 12px;
  }
  .tool{
    background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    color:var(--ink-soft);font-size:12px;font-weight:600;
    position:relative;padding:4px 8px;
  }
  .tool .ic{
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .tool svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .tool:disabled{opacity:.35;}
  .badge{
    position:absolute;top:-2px;right:2px;
    background:var(--accent);color:#fff;
    font-size:10px;font-weight:700;
    min-width:16px;height:16px;padding:0 4px;
    border-radius:9px;display:flex;align-items:center;justify-content:center;
  }
  .notestate{
    position:absolute;top:-4px;right:-2px;
    background:var(--line-soft);color:var(--ink-soft);
    font-size:8px;font-weight:800;padding:1px 5px;border-radius:8px;
  }
  .notestate.on{background:var(--accent);color:#fff;}

  /* Ziffernpad */
  .pad{
    display:flex;justify-content:space-between;
    margin:6px 6px 0;gap:2px;
  }
  .pad button{
    flex:1;border:none;background:none;
    font-size:clamp(24px,8vw,34px);font-weight:600;
    color:var(--accent);padding:8px 0;position:relative;
  }
  .pad button:active{transform:scale(.9);}
  .pad button .cnt{
    display:block;font-size:10px;font-weight:600;color:var(--ink-soft);margin-top:-2px;
  }
  .pad button.done{opacity:.28;pointer-events:none;}

  /* Overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(20,28,45,.55);
    display:none;align-items:center;justify-content:center;padding:24px;z-index:50;
    backdrop-filter:blur(3px);
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);border-radius:26px;padding:28px 24px;
    text-align:center;max-width:340px;width:100%;box-shadow:var(--shadow);
  }
  .modal h2{margin:0 0 6px;font-size:24px;font-weight:800;color:var(--ink);}
  .modal p{margin:0 0 20px;color:var(--ink-soft);font-size:15px;line-height:1.4;}
  .modal .big{font-size:44px;margin-bottom:10px;}
  .modal button{
    width:100%;border:none;border-radius:15px;padding:15px;
    font-size:16px;font-weight:700;background:var(--accent);color:#fff;
    box-shadow:0 6px 18px rgba(61,126,255,.4);
  }
  .modal .ghost{background:var(--line-soft);color:var(--ink);box-shadow:none;margin-top:10px;}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:14px;font-weight:600;
    padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;
    transition:.25s;z-index:60;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

          <text x="16" y="86" fill="#3b4252">2</text>
          <text x="48" y="86" fill="#3d7eff">7</text>
          <text x="48" y="54" fill="#3d7eff">5</text>
        </g>
      </g>
    </svg>
    <h1>Su<span>do</span>ku<small> für <span>Suzanne</span></small></h1>
  </div>

  <div class="levels" id="levels">
    <button data-lvl="easy" class="active">Leicht</button>
    <button data-lvl="medium">Mittel</button>
    <button data-lvl="hard">Schwer</button>
  </div>

  <div class="status">
    <div class="stat"><div class="lbl">Schwierigkeit</div><div class="val" id="sDiff">Leicht</div></div>
    <div class="stat"><div class="lbl">Fehler</div><div class="val" id="sErr">0/3</div></div>
    <div class="stat"><div class="lbl">Zeit</div><div class="val" id="sTime">00:00</div></div>
    <div class="ctrl">
      <button class="start" id="btnStart"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg><span id="startLbl">Neustart</span></button>
      <button id="btnPause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span id="pauseLbl">Pause</span></button>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="tools">
    <button class="tool" id="btnUndo">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg></span>
      Rückg.
    </button>
    <button class="tool" id="btnErase">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 15l7-7 6 6-5 5H8z"/><path d="M14 20h6"/></svg></span>
      Löschen
    </button>
    <button class="tool" id="btnNotes">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="notestate" id="noteState">AUS</span></span>
      Notizen
    </button>
    <button class="tool" id="btnHint">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1v.2h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg><span class="badge" id="hintBadge">3</span></span>
      Hinweis
    </button>
  </div>

  <div class="pad" id="pad"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const boardEl=$("#board"), padEl=$("#pad");
  const LEVELS={easy:{name:"Leicht",remove:40},medium:{name:"Mittel",remove:50},hard:{name:"Schwer",remove:56}};
  let level="easy";
  let solution=[], puzzle=[], grid=[], notes=[], given=[];
  let sel=-1, notesMode=false, errors=0, hints=3, undoStack=[];
  let timer=0, tick=null, paused=false, done=false;
  const MAX_ERR=3;

  /* ---------- Generator ---------- */
  function makeSolved(){
    const g=Array(81).fill(0);
    const nums=[1,2,3,4,5,6,7,8,9];
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
    function ok(g,i,n){
      const r=(i/9|0), c=i%9, br=r-r%3, bc=c-c%3;
      for(let k=0;k<9;k++){
        if(g[r*9+k]===n||g[k*9+c]===n)return false;
        if(g[(br+(k/3|0))*9+(bc+k%3)]===n)return false;
      }
      return true;
    }
    function fill(i){
      if(i>=81)return true;
      if(g[i]){return fill(i+1);}
      for(const n of shuffle(nums.slice())){
        if(ok(g,i,n)){g[i]=n;if(fill(i+1))return true;g[i]=0;}
      }
      return false;
    }
    fill(0);
    return g;
  }
  // eindeutigkeit ausreichend gut: symmetrisches Entfernen mit Solver-Check (light)
  function countSolutions(g,limit){
    let count=0;
    function ok(g,i,n){
      const r=(i/9|0),c=i%9,br=r-r%3,bc=c-c%3;
      for(let k=0;k<9;k++){if(g[r*9+k]===n||g[k*9+c]===n)return false;if(g[(br+(k/3|0))*9+(bc+k%3)]===n)return false;}
      return true;
    }
    function solve(i){
      if(count>=limit)return;
      while(i<81&&g[i])i++;
      if(i>=81){count++;return;}
      for(let n=1;n<=9;n++){if(ok(g,i,n)){g[i]=n;solve(i+1);g[i]=0;if(count>=limit)return;}}
    }
    solve(0);
    return count;
  }
  function makePuzzle(sol,remove){
    const p=sol.slice();
    const idx=[...Array(81).keys()];
    for(let i=idx.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[idx[i],idx[j]]=[idx[j],idx[i]];}
    let removed=0;
    for(const i of idx){
      if(removed>=remove)break;
      const bak=p[i];
      p[i]=0;
      const test=p.slice();
      if(countSolutions(test,2)!==1){p[i]=bak;}
      else removed++;
    }
    return p;
  }

  /* ---------- Spiel-Setup ---------- */
  function newGame(){
    done=false;paused=false;errors=0;hints=3;sel=-1;notesMode=false;undoStack=[];timer=0;
    solution=makeSolved();
    puzzle=makePuzzle(solution,LEVELS[level].remove);
    grid=puzzle.slice();
    given=puzzle.map(v=>v!==0);
    notes=Array.from({length:81},()=>new Set());
    $("#sDiff").textContent=LEVELS[level].name;
    $("#noteState").textContent="AUS";$("#noteState").classList.remove("on");
    $("#hintBadge").textContent=hints;$("#btnHint").disabled=false;
    setPauseLabel();
    updateErr();
    render();
    startTimer();
    $("#overlay").classList.remove("show");
  }

  function buildBoard(){
    boardEl.innerHTML="";
    for(let i=0;i<81;i++){
      const d=document.createElement("div");
      d.className="cell";
      d.dataset.i=i;d.dataset.r=(i/9|0);d.dataset.c=i%9;
      d.addEventListener("click",()=>selectCell(i));
      boardEl.appendChild(d);
    }
  }
  function buildPad(){
    padEl.innerHTML="";
    for(let n=1;n<=9;n++){
      const b=document.createElement("button");
      b.dataset.n=n;
      b.innerHTML=n+'<span class="cnt"></span>';
      b.addEventListener("click",()=>enter(n));
      padEl.appendChild(b);
    }
  }

  /* ---------- Interaktion ---------- */
  function selectCell(i){
    if(done||paused)return;
    sel=i;render();
  }
  function enter(n){
    if(done||paused||sel<0)return;
    if(given[sel])return;
    pushUndo();
    if(notesMode){
      if(grid[sel]===0){
        const s=notes[sel];
        s.has(n)?s.delete(n):s.add(n);
      }
    }else{
      if(grid[sel]===n){grid[sel]=0;}
      else{
        grid[sel]=n;notes[sel].clear();
        if(n!==solution[sel]){
          errors++;updateErr();flashErr(sel);
          if(errors>=MAX_ERR){render();gameOver();return;}
        }else{
          // notizen der peers bereinigen
          clearPeerNotes(sel,n);
        }
      }
    }
    render();
    checkWin();
  }
  function clearPeerNotes(i,n){
    const r=(i/9|0),c=i%9,br=r-r%3,bc=c-c%3;
    for(let k=0;k<9;k++){
      notes[r*9+k].delete(n);notes[k*9+c].delete(n);
      notes[(br+(k/3|0))*9+(bc+k%3)].delete(n);
    }
  }
  function erase(){
    if(done||paused||sel<0||given[sel])return;
    pushUndo();
    grid[sel]=0;notes[sel].clear();render();
  }
  function toggleNotes(){
    notesMode=!notesMode;
    $("#noteState").textContent=notesMode?"AN":"AUS";
    $("#noteState").classList.toggle("on",notesMode);
  }
  function hint(){
    if(done||paused||hints<=0)return;
    let target=sel;
    if(target<0||given[target]||grid[target]===solution[target]){
      // erste leere/falsche Zelle
      target=grid.findIndex((v,i)=>!given[i]&&v!==solution[i]);
    }
    if(target<0)return;
    pushUndo();
    grid[target]=solution[target];
    given[target]=true; // wird als fix/korrekt markiert
    notes[target].clear();
    clearPeerNotes(target,solution[target]);
    hints--;
    $("#hintBadge").textContent=hints;
    if(hints<=0)$("#btnHint").disabled=true;
    sel=target;render();
    toast(hints>0?("Hinweis gesetzt · "+hints+" übrig"):"Letzter Hinweis verbraucht");
    checkWin();
  }
  function pushUndo(){
    undoStack.push({grid:grid.slice(),notes:notes.map(s=>new Set(s)),given:given.slice(),errors,hints,sel});
    if(undoStack.length>60)undoStack.shift();
  }
  function undo(){
    if(done||paused||!undoStack.length)return;
    const s=undoStack.pop();
    grid=s.grid;notes=s.notes;given=s.given;errors=s.errors;hints=s.hints;sel=s.sel;
    $("#hintBadge").textContent=hints;$("#btnHint").disabled=hints<=0;
    updateErr();render();
  }

  /* ---------- Rendering ---------- */
  function render(){
    const selVal=sel>=0?grid[sel]:0;
    const selR=sel>=0?(sel/9|0):-1, selC=sel>=0?sel%9:-1;
    const selBr=selR>=0?selR-selR%3:-1, selBc=selC>=0?selC-selC%3:-1;
    for(let i=0;i<81;i++){
      const cell=boardEl.children[i];
      const r=i/9|0,c=i%9;
      cell.className="cell";
      if(given[i])cell.classList.add("given");
      // peer highlight
      if(sel>=0){
        const sameBox=(r-r%3===selBr)&&(c-c%3===selBc);
        if(r===selR||c===selC||sameBox)cell.classList.add("peer");
        if(i===sel)cell.classList.add("sel");
        if(selVal&&grid[i]===selVal&&grid[i]!==0)cell.classList.add("same");
      }
      // inhalt
      if(grid[i]){
        cell.textContent=grid[i];
        if(!given[i]&&grid[i]!==solution[i])cell.classList.add("err");
      }else if(notes[i].size){
        cell.textContent="";
        const nb=document.createElement("div");nb.className="notes";
        for(let n=1;n<=9;n++){
          const sp=document.createElement("span");
          sp.textContent=notes[i].has(n)?n:"";
          nb.appendChild(sp);
        }
        cell.appendChild(nb);
      }else{
        cell.textContent="";
      }
    }
    // pad counts + done
    const counts=Array(10).fill(0);
    for(let i=0;i<81;i++)if(grid[i])counts[grid[i]]++;
    for(const b of padEl.children){
      const n=+b.dataset.n;
      b.querySelector(".cnt").textContent=counts[n]>=9?"":"";
      b.classList.toggle("done",counts[n]>=9);
    }
    $("#btnUndo").disabled=!undoStack.length;
  }
  function flashErr(i){
    const cell=boardEl.children[i];
    cell.classList.add("errflash");
    setTimeout(()=>cell.classList.remove("errflash"),450);
  }
  function updateErr(){
    const e=$("#sErr");
    e.textContent=errors+"/"+MAX_ERR;
    e.classList.toggle("bad",errors>0);
  }

  /* ---------- Timer ---------- */
  function startTimer(){
    clearInterval(tick);
    tick=setInterval(()=>{if(!paused&&!done){timer++;renderTime();}},1000);
    renderTime();
  }
  function renderTime(){
    const m=String(timer/60|0).padStart(2,"0"),s=String(timer%60).padStart(2,"0");
    $("#sTime").textContent=m+":"+s;
  }

  /* ---------- Sieg / Niederlage ---------- */
  function checkWin(){
    for(let i=0;i<81;i++)if(grid[i]!==solution[i])return;
    done=true;clearInterval(tick);
    const m=String(timer/60|0).padStart(2,"0"),s=String(timer%60).padStart(2,"0");
    showModal(`<div class="big">🎉</div><h2>Gelöst!</h2>
      <p>Level ${LEVELS[level].name} · Zeit ${m}:${s} · Fehler ${errors}/${MAX_ERR}</p>
      <button id="mNew">Neues Spiel</button>`,()=>$("#mNew").addEventListener("click",newGame));
  }
  function gameOver(){
    done=true;clearInterval(tick);
    showModal(`<div class="big">😕</div><h2>Zu viele Fehler</h2>
      <p>Du hast das Limit von ${MAX_ERR} Fehlern erreicht.</p>
      <button id="mRetry">Neues Spiel</button>
      <button class="ghost" id="mSolve">Lösung zeigen</button>`,()=>{
        $("#mRetry").addEventListener("click",newGame);
        $("#mSolve").addEventListener("click",()=>{grid=solution.slice();render();$("#overlay").classList.remove("show");});
      });
  }

  /* ---------- Pause / Neustart / Overlay / Toast ---------- */
  function setPauseLabel(){
    const p=$("#btnPause");
    p.querySelector("#pauseLbl").textContent=paused?"Weiter":"Pause";
    p.querySelector("svg").innerHTML=paused
      ?'<path d="M6 4l14 8-14 8V4z"/>'          /* Play */
      :'<path d="M8 5v14M16 5v14"/>';           /* Pause */
  }
  function resume(){paused=false;setPauseLabel();$("#overlay").classList.remove("show");}
  function togglePause(){
    if(done)return;
    paused=!paused;setPauseLabel();
    if(paused){
      showModal(`<div class="big">⏸</div><h2>Pause</h2><p>Das Spiel läuft weiter, sobald du fortsetzt.</p>
        <button id="mResume">Fortsetzen</button>`,()=>$("#mResume").addEventListener("click",resume));
    }
  }
  function restart(){
    // Bei laufendem, angefangenem Spiel nachfragen
    const started=timer>0 && !done && grid.some((v,i)=>!given[i]&&v!==0);
    if(started){
      const wasPaused=paused;paused=true;
      showModal(`<div class="big">↻</div><h2>Neustart?</h2>
        <p>Das aktuelle Spiel (${LEVELS[level].name}) wird verworfen und ein neues erstellt.</p>
        <button id="mYes">Neues Spiel starten</button>
        <button class="ghost" id="mNo">Abbrechen</button>`,()=>{
          $("#mYes").addEventListener("click",newGame);
          $("#mNo").addEventListener("click",()=>{paused=wasPaused;$("#overlay").classList.remove("show");});
        });
    }else{
      newGame();
    }
  }
  function showModal(html,after){
    $("#modal").innerHTML=html;
    $("#overlay").classList.add("show");
    if(after)after();
  }
  let toastT=null;
  function toast(msg){
    const t=$("#toast");t.textContent=msg;t.classList.add("show");
    clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1600);
  }

  /* ---------- Events ---------- */
  $("#levels").addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    [...$("#levels").children].forEach(x=>x.classList.remove("active"));
    b.classList.add("active");level=b.dataset.lvl;newGame();
  });
  $("#btnUndo").addEventListener("click",undo);
  $("#btnErase").addEventListener("click",erase);
  $("#btnNotes").addEventListener("click",toggleNotes);
  $("#btnHint").addEventListener("click",hint);
  $("#btnPause").addEventListener("click",togglePause);
  $("#btnStart").addEventListener("click",restart);
  document.addEventListener("keydown",e=>{
    if(e.key>="1"&&e.key<="9")enter(+e.key);
    else if(e.key==="Backspace"||e.key==="Delete")erase();
    else if(e.key==="n"||e.key==="N")toggleNotes();
  });

  /* ---------- Start ---------- */
  buildBoard();buildPad();newGame();
})();
</script>
</body>
</html>
